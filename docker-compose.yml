services:
  db:
    image: postgres:18
    container_name: begband-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?add meg a DB_PASSWORD-ot a repo gyokereben levo .env-ben}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - begband_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  begband_pgdata:
    name: begband_pgdata
